
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'bo.aquarella.copiar'
    compileSdk 35

    defaultConfig {
        applicationId 'bo.aquarella.copiar'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'

        buildConfigField "String", "COPIAR_AQ_TOKEN",
                "\"${System.getenv('COPIAR_AQ_TOKEN') ?: ''}\""
    }

    signingConfigs {
        stable {
            storeFile rootProject.file("copiar-aq-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Base de datos local Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}

kapt {
    correctErrorTypes true
}
