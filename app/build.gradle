plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'bo.aquarella.copiar'
    compileSdk 35

    defaultConfig {
        applicationId 'bo.aquarella.copiar'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'

        buildConfigField "String", "COPIAR_AQ_TOKEN",
                "\"${System.getenv('COPIAR_AQ_TOKEN') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
}
