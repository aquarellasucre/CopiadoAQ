name: Construir APK Copiar AQ

on:
  workflow_dispatch:
  push:
    branches:
      - plantillas-mensajes
      - consulta-stock

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar token de Registro de Pedidos
        env:
          PEDIDOS_TOKEN: ${{ secrets.COPIAR_AQ_PEDIDOS_TOKEN }}
        run: |
          if [ -z "$PEDIDOS_TOKEN" ]; then
            echo "::error::Falta el secreto COPIAR_AQ_PEDIDOS_TOKEN"
            exit 1
          fi
          echo "Token de Registro de Pedidos recibido correctamente."

      - name: Recuperar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > copiar-aq-release.jks

      - name: Construir APK firmada
        env:
          COPIAR_AQ_TOKEN: ${{ secrets.COPIAR_AQ_TOKEN }}
          COPIAR_AQ_PEDIDOS_TOKEN: ${{ secrets.COPIAR_AQ_PEDIDOS_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Copiar-AQ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
